<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="description" content="David M. KAYEMBE, Managing Director — SIMPLE LIFESTYLE SARLU (SILS), Kinshasa.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#FAF8F3">
    <meta name="referrer" content="no-referrer">
    <link rel="canonical" href="https://kmdavid3.github.io/carte-dkayembe/">
    <meta property="og:type" content="profile">
    <meta property="og:url" content="https://kmdavid3.github.io/carte-dkayembe/">
    <meta property="og:title" content="David M. KAYEMBE — SILS">
    <meta property="og:description" content="Managing Director · SIMPLE LIFESTYLE SARLU · Kinshasa, RDC">
    <title>David M. KAYEMBE — SILS</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="ambient" aria-hidden="true"><span class="amb-ring"></span><span class="amb-disc"></span><span class="amb-bar"></span></div>

    <main class="page">
      <!--
        Coordonnées : modifier le texte ET le lien (tel:) de chaque ligne.
        - data-card-url : adresse publique de cette carte (QR « Lien » et partage).
        - data-website  : adresse publique du site SILS ; vide = ligne « Site » masquée.
        Le bouton « Ajouter aux contacts », le QR code et WhatsApp reprennent automatiquement ces informations.
      -->
      <article class="card" id="carte" data-card-url="https://kmdavid3.github.io/carte-dkayembe/" data-website="">
        <header class="card-top">
          <img class="card-logo" src="assets/sils-logo-signature.svg" alt="SILS" width="120" height="49">
          <div class="card-art" aria-hidden="true">
            <span class="art-ring"></span><span class="art-disc"></span><span class="art-bar"></span><span class="art-square"></span>
          </div>
        </header>

        <div class="card-id">
          <p class="eyebrow"><span class="live-dot" aria-hidden="true"></span><span data-field="org">SIMPLE LIFESTYLE SARLU</span></p>
          <h1><span data-field="given">David</span> <span data-field="additional">M.</span> <span data-field="family">KAYEMBE</span></h1>
          <p class="role" data-field="title">Managing Director</p>
        </div>

        <ul class="contact-list">
          <li>
            <a class="row" data-field="tel" href="tel:+243820840896">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 3.5h2.6l1.3 4.1-1.9 1.3a12 12 0 0 0 6.5 6.5l1.3-1.9 4.1 1.3v2.6a2 2 0 0 1-2.1 2A16.6 16.6 0 0 1 4.6 5.6a2 2 0 0 1 2-2.1Z"/></svg>
              <span class="row-text"><small>Téléphone</small><strong>+243 82 084 08 96</strong></span>
              <span class="row-go" aria-hidden="true">→</span>
            </a>
          </li>
          <li>
            <a class="row" data-field="whatsapp" href="https://wa.me/243820840896" rel="noopener">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 19.5 5.6 16A8 8 0 1 1 8.3 18.6Z"/><path d="M9.2 9.3c.3 2 1.8 3.6 3.9 4.3l1-1 1.6.7"/></svg>
              <span class="row-text"><small>WhatsApp</small><strong>Écrire un message</strong></span>
              <span class="row-go" aria-hidden="true">→</span>
            </a>
          </li>
          <li>
            <a class="row" data-field="email" href="mailto:kayembe.david@gmail.com">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="m4 6 8 7 8-7"/></svg>
              <span class="row-text"><small>E-mail</small><strong>kayembe.david@gmail.com</strong></span>
              <span class="row-go" aria-hidden="true">→</span>
            </a>
          </li>
          <li hidden>
            <a class="row" data-field="site" href="#">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.3 3.6 5.1 3.6 8.5s-1.2 6.2-3.6 8.5c-2.4-2.3-3.6-5.1-3.6-8.5S9.6 5.8 12 3.5Z"/></svg>
              <span class="row-text"><small>Site</small><strong>Découvrir SILS</strong></span>
              <span class="row-go" aria-hidden="true">→</span>
            </a>
          </li>
          <li>
            <div class="row row-static">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.4"/></svg>
              <span class="row-text"><small>Adresse</small><strong data-field="address" data-locality="Kinshasa" data-country="République démocratique du Congo">Kinshasa, RDC</strong></span>
            </div>
          </li>
        </ul>

        <div class="card-actions">
          <button class="button" type="button" data-action="save">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="8" r="3.5"/><path d="M3.5 19.5a6.5 6.5 0 0 1 13 0M19 8v6M16 11h6"/></svg>
            Ajouter aux contacts
          </button>
          <button class="button button-ghost" type="button" data-action="share">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v11M7.5 8 12 3.5 16.5 8M5.5 13v5.5a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V13"/></svg>
            Partager
          </button>
        </div>

        <section class="qr-block" aria-labelledby="qr-label">
          <div class="qr-switch" hidden>
            <button type="button" data-qr-mode="contact" aria-pressed="true">Contact</button>
            <button type="button" data-qr-mode="link" aria-pressed="false">Lien</button>
          </div>
          <div class="qr-frame">
            <div class="qr-code" role="img" aria-label="QR code"></div>
            <span class="qr-corner" aria-hidden="true"></span>
          </div>
          <p class="qr-label" id="qr-label">Scannez pour enregistrer le contact</p>
        </section>

        <footer class="card-foot">
          <span>SILS · Kinshasa, RDC</span>
          <span>Heure locale <span class="clock" data-clock>--:--</span></span>
        </footer>
      </article>
    </main>

    <div class="toast" role="status" aria-live="polite"></div>

    <script src="qr.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
